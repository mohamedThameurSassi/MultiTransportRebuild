spring.application.name=mtl-transit-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_multitransport}
spring.datasource.username=${DB_USER:mtsassi}
spring.datasource.password=${DB_PASSWORD:motdepasse}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

server.port=8080